name: Unit and integration mock tests

on:
  push:
    branches: [main, feature/evitar-duplicados]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: node --check app.js
      - name: Run mocked tests
        run: npm test
